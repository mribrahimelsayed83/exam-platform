name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - name: Syntax-check every backend file
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node -c
      - name: Run tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - name: Build
        # Public API URL, not a secret — same value already visible in every
        # network request the deployed frontend makes.
        env:
          VITE_API_URL: https://api.mribrahimfarouk.com
        run: npm run build
